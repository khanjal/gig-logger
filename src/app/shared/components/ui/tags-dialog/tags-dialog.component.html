<div class="tags-dialog">
<h2 mat-dialog-title>Tags</h2>

<mat-dialog-content class="tags-dialog__content">
  <!-- Input and Add sit on one row: on a phone the keyboard covers most of the screen, so the
       action has to be reachable without scrolling or dismissing it. -->
  <div class="flex items-start gap-2">
    <mat-form-field class="flex-1 min-w-0 rg-field-shell" appearance="fill">
      <mat-label>Add a tag</mat-label>
      <input
        matInput
        [placeholder]="placeholder"
        [formControl]="inputControl"
        [matAutocomplete]="auto"
        (input)="onInput(inputControl.value ?? '')"
        (keydown.enter)="add(inputControl.value); $event.preventDefault()" />
      <mat-autocomplete #auto="matAutocomplete" (optionSelected)="selected($event)">
        @for (suggestion of suggestions(); track suggestion) {
          <mat-option [value]="suggestion">{{ suggestion }}</mat-option>
        }
      </mat-autocomplete>
    </mat-form-field>

    <app-base-rect-button
      class="tags-dialog__add"
      [label]="'Add'"
      [variant]="'primary'"
      [disabled]="!(inputControl.value ?? '').trim()"
      (clicked)="add(inputControl.value)">
    </app-base-rect-button>
  </div>

  <div class="tags-dialog__tags">
    @if (tags().length > 0) {
      <div class="flex flex-wrap gap-2">
        @for (tag of tags(); track tag) {
          <span class="tag-chip inline-flex items-center gap-1 pl-3 pr-1 py-1 rounded-full text-sm">
            {{ tag }}
            <button
              type="button"
              class="tags-dialog__remove"
              [attr.aria-label]="'Remove ' + tag"
              (click)="remove(tag)">
              <mat-icon>cancel</mat-icon>
            </button>
          </span>
        }
      </div>
    } @else {
      <p class="text-sm text-tertiary m-0">No tags yet.</p>
    }
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="tags-dialog__actions">
  <app-base-rect-button [label]="'Cancel'" [variant]="'outlined'" (clicked)="onCancel()"></app-base-rect-button>
  <app-base-rect-button [label]="'Done'" [variant]="'primary'" (clicked)="onDone()"></app-base-rect-button>
</mat-dialog-actions>
</div>
