<h2 mat-dialog-title>Tags</h2>

<mat-dialog-content>
  <mat-form-field class="w-full rg-field-shell" appearance="fill">
    <mat-label>Add a tag</mat-label>
    <input
      matInput
      [placeholder]="placeholder"
      [formControl]="inputControl"
      [matAutocomplete]="auto"
      (input)="onInput(inputControl.value ?? '')"
      (keydown.enter)="add(inputControl.value); $event.preventDefault()" />
    <mat-autocomplete #auto="matAutocomplete" (optionSelected)="selected($event)">
      @for (suggestion of suggestions(); track suggestion) {
        <mat-option [value]="suggestion">{{ suggestion }}</mat-option>
      }
    </mat-autocomplete>
  </mat-form-field>

  @if (tags().length > 0) {
    <mat-chip-set class="mt-2">
      @for (tag of tags(); track tag) {
        <mat-chip (removed)="remove(tag)">
          {{ tag }}
          <button matChipRemove [attr.aria-label]="'Remove ' + tag" type="button">
            <mat-icon>cancel</mat-icon>
          </button>
        </mat-chip>
      }
    </mat-chip-set>
  } @else {
    <p class="text-sm text-tertiary mt-2">No tags yet.</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <app-base-rect-button [label]="'Cancel'" [variant]="'outlined'" (clicked)="onCancel()"></app-base-rect-button>
  <app-base-rect-button [label]="'Done'" [variant]="'primary'" (clicked)="onDone()"></app-base-rect-button>
</mat-dialog-actions>
