<div class="app-tag-input rg-field-shell flex items-center gap-2 px-3 py-2 rounded">
  <div class="flex-1 min-w-0">
    <div class="text-xs text-tertiary mb-1">{{ fieldName }}</div>
    @if (tags().length > 0) {
      <mat-chip-set>
        @for (tag of tags(); track tag) {
          <mat-chip [disableRipple]="true" [removable]="false">{{ tag }}</mat-chip>
        }
      </mat-chip-set>
    } @else {
      <span class="text-sm text-tertiary">None</span>
    }
  </div>
  <app-base-rect-button
    [icon]="'edit'"
    [variant]="'icon'"
    [disabled]="disabled()"
    [attr.aria-label]="'Edit ' + fieldName"
    (clicked)="openDialog()">
  </app-base-rect-button>
</div>
