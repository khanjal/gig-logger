name: Lambda Tests

on:
  push:
    paths:
      - 'amplify/backend/function/GigRaptorService/**'
      - '.github/workflows/lambda-test.yml'
      - '.github/actions/setup-dotnet-env/**'
      - 'global.json'
  pull_request:
    paths:
      - 'amplify/backend/function/GigRaptorService/**'
      - '.github/workflows/lambda-test.yml'
      - '.github/actions/setup-dotnet-env/**'
      - 'global.json'

concurrency:
  # Pull-request runs share a group per PR, so a newer push cancels the older run.
  # Every other run (push to main) gets its own group, so it is never cancelled or replaced.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet-env
        with:
          solution-path: amplify/backend/function/GigRaptorService/GigRaptorService.sln

      - name: Build
        run: dotnet build amplify/backend/function/GigRaptorService/GigRaptorService.sln --no-restore

      - name: Run tests
        run: dotnet test amplify/backend/function/GigRaptorService/GigRaptorService.sln --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          flags: lambda
          name: lambda-coverage
          fail_ci_if_error: false
