name: Lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Pull-request runs share a group per PR, so a newer push cancels the older run.
  # Every other run (push to main) gets its own group, so it is never cancelled or replaced.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-env
      - name: Lint
        run: npm run lint --if-present
