name: Lambda Lint

on:
  push:
    paths:
      - 'amplify/backend/function/GigRaptorService/**'
      - '.github/workflows/lambda-lint.yml'
      - '.github/actions/setup-dotnet-env/**'
      - 'global.json'
  pull_request:
    paths:
      - 'amplify/backend/function/GigRaptorService/**'
      - '.github/workflows/lambda-lint.yml'
      - '.github/actions/setup-dotnet-env/**'
      - 'global.json'

concurrency:
  # Pull-request runs share a group per PR, so a newer push cancels the older run.
  # Every other run (push to main) gets its own group, so it is never cancelled or replaced.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet-env
        with:
          solution-path: amplify/backend/function/GigRaptorService/GigRaptorService.sln

      - name: Check formatting
        run: dotnet format amplify/backend/function/GigRaptorService/GigRaptorService.sln --verify-no-changes
